name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 빌드 및 테스트
        run: ./gradlew build jacocoAggregateReport

      - name: 커버리지 요약
        if: always()
        run: python3 .github/scripts/coverage_summary.py

      - name: 테스트 결과 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: 커버리지 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: |
            build/reports/jacoco/aggregate/
            **/build/reports/jacoco/test/
          if-no-files-found: ignore
          retention-days: 7
