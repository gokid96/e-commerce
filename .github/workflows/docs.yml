name: API 문서 배포

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/asciidoc/**'
      - 'service/**'
      - 'support/rest-docs/**'
      - 'build.gradle'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: REST Docs 생성
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: REST Docs HTML 생성
        run: ./gradlew asciidoctor

      - name: Pages 설정
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 산출물 업로드
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs/asciidoc

  deploy:
    name: GitHub Pages 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
