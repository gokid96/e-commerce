plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.5' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.github.gokid96'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.0"
            mavenBom "org.testcontainers:testcontainers-bom:1.20.6"
        }
    }

    dependencies {
        implementation 'org.slf4j:slf4j-api'

        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
        testImplementation 'org.springframework.boot:spring-boot-testcontainers'
        testImplementation 'org.testcontainers:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.named('test') {
        useJUnitPlatform()
        finalizedBy tasks.named('jacocoTestReport')
    }

    tasks.named('jacocoTestReport') {
        dependsOn tasks.named('test')

        reports {
            xml.required = true
            html.required = true
        }

        classDirectories.setFrom(
                files(classDirectories.files.collect {
                    fileTree(dir: it, exclude: [
                            '**/*Application.class',
                            '**/config/**',
                            '**/*Config.class',
                            '**/*Request.class',
                            '**/*Response.class',
                            '**/*Command*.class',
                            '**/*Criteria*.class',
                            '**/*Info*.class',
                            '**/*Result*.class',
                            '**/*Event.class',
                            '**/*Event$*.class',
                    ])
                })
        )
    }

    tasks.matching { it.name == 'bootJar' }.configureEach {
        archiveFileName = "${project.name}.jar"
    }
}

configure(subprojects.findAll { !it.path.startsWith(':service:') }) {
    tasks.matching { it.name == 'bootJar' }.configureEach { enabled = false }
    tasks.matching { it.name == 'jar' }.configureEach { enabled = true }
}

configure(subprojects.findAll { it.path.startsWith(':service:') }) {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'io.micrometer:micrometer-registry-prometheus'
    }
}

def coverageProjects = subprojects.findAll { it.file('src/main/java').exists() }

def coverageExcludes = [
        '**/*Application.class',
        '**/config/**',
        '**/*Config.class',
        '**/*Request.class',
        '**/*Response.class',
        '**/*Command*.class',
        '**/*Criteria*.class',
        '**/*Info*.class',
        '**/*Result*.class',
        '**/*Event.class',
        '**/*Event$*.class',
]

tasks.register('jacocoAggregateReport', JacocoReport) {
    group = 'verification'
    description = '테스트가 존재하는 전체 모듈의 커버리지를 하나의 리포트로 합산한다.'

    dependsOn coverageProjects.collect { it.tasks.named('test') }

    executionData.setFrom(
            files(coverageProjects.collect { it.layout.buildDirectory.file('jacoco/test.exec') })
                    .filter { it.exists() }
    )

    sourceDirectories.setFrom(files(coverageProjects.collect { it.file('src/main/java') }))

    classDirectories.setFrom(
            files(coverageProjects.collect {
                fileTree(dir: it.layout.buildDirectory.dir('classes/java/main'), exclude: coverageExcludes)
            })
    )

    reports {
        xml.required = true
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/aggregate/html')
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/aggregate/jacoco.xml')
    }
}

