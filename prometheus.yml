global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'ecommerce-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'user-api:8081' ]
        labels:
          service: user
      - targets: [ 'balance-api:8082' ]
        labels:
          service: balance
      - targets: [ 'coupon-api:8083' ]
        labels:
          service: coupon
      - targets: [ 'product-api:8084' ]
        labels:
          service: product
      - targets: [ 'order-api:8085' ]
        labels:
          service: order
      - targets: [ 'payment-api:8086' ]
        labels:
          service: payment
