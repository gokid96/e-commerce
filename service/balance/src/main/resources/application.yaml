server:
  port: 8082

spring:
  application:
    name: ecommerce-balance-service
  config:
    import:
      - client.yml
  datasource:
    url: jdbc:mysql://localhost:3307/ecommerce
    username: application
    password: application
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 3
      connection-timeout: 10000
      max-lifetime: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    enable:
      all: true
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://mysql:3306/ecommerce
  jpa:
    show-sql: false
