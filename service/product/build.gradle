dependencies {
    // Spring
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'

    // DB
    runtimeOnly 'com.mysql:mysql-connector-j'

    // QueryDSL
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.3.0'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.3.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // Common
    implementation project(':common:cache')
    implementation project(':common:message')
    implementation project(':common:outbox')
    implementation project(':common:key')

    // TestContainers
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:kafka'

    // RestDocs
    testImplementation project(':support:rest-docs')
}